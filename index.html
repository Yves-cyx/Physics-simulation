<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Notebook · Physics studio</title><link rel="stylesheet" href="style.css">
<header><b><i>∿</i> Motion Notebook</b><a href="https://github.com/Yves-cyx/Physics-simulation">GitHub ↗</a></header>
<main><nav aria-label="Experiment"><button class="tab" data-mode="cascade">木轨连锁反应</button><button class="tab" data-mode="carts">Spring carts</button><button class="tab" data-mode="binary">Binary stars</button><button class="tab" data-mode="race">Rolling race</button><button class="tab active" data-mode="bounce">Bouncing ball</button><button class="tab" data-mode="pendulum">Pendulum</button></nav>
<h1 id="title">The bouncing ball.</h1><p id="intro">Drop a basketball onto hardwood and follow the energy through each rebound.</p>
<section class="studio"><article><canvas id="field" width="1000" height="640" aria-label="Animated experiment with scale, velocity and live motion graph"></canvas><div class="transport"><button id="play">Pause</button><button id="reset">↺ Reset</button><label>Playback <select id="rate"><option value=".25">¼×</option><option value=".5" selected>½×</option><option value="1">1×</option></select></label><output id="clock">0.00 s</output></div></article>
<aside><h2>Experiment controls</h2><div id="params"></div><hr><label class="check"><input id="vector" type="checkbox" checked> Velocity arrow</label><label class="check"><input id="trace" type="checkbox" checked> Motion graph</label><hr><label class="layout">Canvas format <select id="format"><option value="portrait">Portrait · 9:16</option><option value="wide">Landscape</option></select></label><label class="check" id="guideLabel"><input id="guide" type="checkbox" checked> Guided replay · 12 seconds</label><button id="record">● &nbsp; Record experiment</button><small id="status" role="status">Saves the illustrated scene as a video.</small></aside></section>
<section class="notes"><h2>Model notes</h2><p id="model"></p></section></main><script src="vendor/matter.min.js"></script><script type="module" src="studio.js"></script></html>
