<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木塔实验台 · Motion Notebook</title><link rel="stylesheet" href="style.css">
<style>
main{max-width:1180px}h1{font-size:clamp(34px,5vw,58px)}.bench{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(215px,1fr);gap:16px}.panel{border:1px solid #c6cbbf;border-radius:12px;background:#fffdf5;padding:16px}.surface{padding:0;overflow:hidden}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px}.tools input{width:100%}#world{touch-action:none}#eventJump{border-color:#458379;color:#245c52;background:#eef6f0}.tools button,.settings button{min-height:44px}.primary{background:#2e5146;color:white}.settings label{display:block;margin:14px 0}.settings input[type=range]{display:block;width:100%}#readout{font:15px monospace}h2{margin:6px 0 12px}.settings p{font-size:14px}.legend{color:#377669}#note{min-height:1.5em}#shareurl{width:100%}@media(max-width:760px){.bench{grid-template-columns:1fr}}
</style>
<header><b><i>∿</i> Motion Notebook</b><a href="./index.html">返回模拟平台</a></header><main><h1>木塔实验台</h1><p><span id="task">只移动一根底柱，能让两颗绿球在 7 秒内都不碰地吗？红球每次从同一点释放。</span></p>
<div class="bench"><div class="panel surface"><canvas width="880" height="450" id="world" aria-label="木塔与两根可水平拖动的底柱，亦可用位置滑块操作"></canvas>
<div class="tools"><button id="eventJump" hidden></button><button id="run" class="primary">运行实验</button><button id="edit">回到搭建</button><button id="hit">首次碰撞</button><output id="readout"></output><input id="timeline" type="range" min="0" max="840" value="0" step="1" aria-label="逐帧时间轴"><button id="back">上一帧</button><button id="next">下一帧</button><label><input type="checkbox" id="ghost" checked style="width:auto"> 叠加基准轮廓</label></div></div>
<div class="panel settings"><h2>底层支撑</h2><p>直接拖动底柱。回放时点中一根底柱，即可回到它的起点调整。</p><label>左柱 <output id="leftVal"></output><input id="left" type="range" min="640" max="753"></label><label>右柱 <output id="rightVal"></output><input id="right" type="range" min="640" max="753"></label>
<button id="pin">将当前方案设为基准</button><p class="legend" id="basis"></p><p id="result"></p><button id="share">复制方案链接</button><small id="scope"></small><input hidden readonly id="shareurl" aria-label="方案链接"><p id="note" role="status"></p></div></div></main>
<script src="vendor/matter.min.js"></script><script type="module" src="tower.mjs"></script></html>
